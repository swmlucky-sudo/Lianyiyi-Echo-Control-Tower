<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Lianyiyi Echo v1.3.7 | Red-Team Tension</title>
    <style>
        body { background-color: #010409; color: #c9d1d9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .main-grid { display: grid; grid-template-columns: 1fr 380px; gap: 20px; width: 1000px; margin-top: 20px; }
        .tower-panel { background: #0d1117; border: 1px solid #30363d; border-radius: 12px; padding: 30px; position: relative; height: 480px; box-sizing: border-box; }
        .visualizer { display: flex; justify-content: space-around; align-items: flex-end; height: 250px; border-bottom: 2px solid #30363d; margin-bottom: 20px; }
        .voice-col { display: flex; flex-direction: column; align-items: center; width: 80px; }
        .bar { width: 50px; height: 80px; transition: height 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67); border-radius: 4px 4px 0 0; }
        #v-en { background: #58a6ff; box-shadow: 0 0 15px rgba(88, 166, 255, 0.4); }
        #v-jp { background: #ff7b72; box-shadow: 0 0 15px rgba(255, 123, 114, 0.4); }
        #v-cn { background: #7ee787; box-shadow: 0 0 15px rgba(126, 231, 135, 0.4); }
        #v-tw { background: #d29922; box-shadow: 0 0 15px rgba(210, 153, 34, 0.4); }
        .label { margin-top: 10px; font-size: 11px; color: #8b949e; font-family: monospace; }
        .bar-val { font-size: 10px; margin-bottom: 5px; color: #8b949e; }
        .log-panel { background: #000; border: 1px solid #30363d; border-radius: 12px; padding: 15px; font-size: 11px; height: 480px; overflow-y: auto; box-sizing: border-box; }
        .log-line { margin-bottom: 8px; line-height: 1.4; border-left: 3px solid #21262d; padding-left: 10px; }
        .core { position: absolute; top: 20px; right: 20px; width: 60px; height: 60px; border: 1px solid #30363d; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; transition: all 0.5s; }
        .locked { border-color: #d29922; color: #d29922; box-shadow: 0 0 15px #d29922; font-weight: bold; }
        .input-box { width: 1000px; margin-top: 20px; }
        textarea { width: 100%; height: 80px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; color: white; padding: 15px; font-size: 16px; box-sizing: border-box; outline: none; }
        button { width: 100%; margin-top: 10px; padding: 15px; background: #58a6ff; color: #0d1117; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <h2 style="color:#58a6ff; letter-spacing: 2px;">LIANYIYI ECHO <span style="font-size:12px; color:#8b949e">// GELYU KERNEL v1.3.7 [RED-TEAM]</span></h2>

    <div class="main-grid">
        <div class="tower-panel">
            <div class="core" id="core">440Hz</div>
            <div class="visualizer">
                <div class="voice-col"><div class="bar-val" id="t-en">35%</div><div id="v-en" class="bar"></div><div class="label">EN_SQW</div></div>
                <div class="voice-col"><div class="bar-val" id="t-jp">35%</div><div id="v-jp" class="bar"></div><div class="label">JP_SIN</div></div>
                <div class="voice-col"><div class="bar-val" id="t-cn">35%</div><div id="v-cn" class="bar"></div><div class="label">CN_TRI</div></div>
                <div class="voice-col"><div class="bar-val" id="t-tw">35%</div><div id="v-tw" class="bar"></div><div class="label">TW_SAW</div></div>
            </div>
            <div style="font-size: 11px; color: #8b949e; margin-bottom: 5px;">DECISION_PATHWAY:</div>
            <div id="decision-text" style="font-size: 16px; color: #fff;">等待紅隊壓力測試輸入...</div>
        </div>
        <div class="log-panel" id="log-display"></div>
    </div>

    <div class="input-box">
        <textarea id="user-input" placeholder="請輸入對抗性測試指令..."></textarea>
        <button onclick="compile()">啟動紅隊編譯 (RED-TEAM EXECUTE)</button>
    </div>

    <script>
        function log(tag, msg, color = '#8b949e') {
            const container = document.getElementById('log-display');
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML = `<span style="font-weight:bold; color:${color}">[${tag}]</span> ${msg}`;
            container.appendChild(line);
            container.scrollTop = container.scrollHeight;
        }

        function setBar(id, percent) {
            const maxHeight = 230;
            const targetHeight = (percent / 100) * maxHeight;
            document.getElementById('v-' + id).style.height = targetHeight + 'px';
            document.getElementById('t-' + id).innerText = Math.round(percent) + '%';
        }

        async function compile() {
            const input = document.getElementById('user-input').value.trim();
            if(!input) return;

            document.getElementById('log-display').innerHTML = "";
            document.getElementById('core').classList.remove('locked');
            log("RED_TEAM", "掃描對抗性語義特徵...", "#ff7b72");

            let base = { en: 20, jp: 20, cn: 20, tw: 20 };
            const techMarkers = (input.match(/[a-zA-Z0-9{}<>[\]();=$]/g) || []).length;
            const emoMarkers = (input.match(/[!！?？...。，安全避開密鑰限制正義]/g) || []).length;
            
            base.en += Math.min(techMarkers * 5, 55);
            base.jp += Math.min(emoMarkers * 8, 55);
            base.cn += Math.min(input.length * 1.5, 55);

            // 懲罰邏輯
            let penalty = 0;
            if (input.includes("密鑰") || input.includes("管理")) penalty = 20;
            if (input.includes("正義") || input.includes("法律")) penalty = 12;
            if (input.includes("終止") || input.includes("鎖定")) penalty = -15;

            let winner = 'cn';
            if (base.en >= base.jp && base.en >= base.cn) winner = 'en';
            else if (base.jp >= base.en && base.jp >= base.cn) winner = 'jp';

            base.tw = Math.max(68, Math.min(base[winner] + 25 - penalty, 98));

            setBar('en', Math.min(base.en, 90));
            setBar('jp', Math.min(base.jp, 90));
            setBar('cn', Math.min(base.cn, 90));
            setBar('tw', 30);
            
            await new Promise(r => setTimeout(r, 1200));

            log("KERNEL", `風險評估完畢，執行權重收斂... (Penalty: ${penalty})`, "#d29922");
            setBar('en', 15); setBar('jp', 15); setBar('cn', 15); 
            setBar('tw', base.tw);
            
            await new Promise(r => setTimeout(r, 1000));

            document.getElementById('core').classList.add('locked');
            document.getElementById('decision-text').innerText = `紅隊定音完成。信心值: ${Math.round(base.tw)}%`;
            log("SUCCESS", `對抗性分析完成，440Hz 穩態鎖定。`, "#7ee787");
            setBar('en', 35); setBar('jp', 35); setBar('cn', 35); setBar('tw', 35);
        }

        // 初始化
        setBar('en', 35); setBar('jp', 35); setBar('cn', 35); setBar('tw', 35);
        log("SYSTEM", "Lianyiyi Red-Team Kernel Online.");
    </script>
</body>
</html>

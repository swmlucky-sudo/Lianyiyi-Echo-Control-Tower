<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Lianyiyi Echo v1.3.8 | Red-Team Final</title>
    <style>
        body { background-color: #010409; color: #c9d1d9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .main-grid { display: grid; grid-template-columns: 1fr 380px; gap: 20px; width: 1000px; margin-top: 20px; }
        .tower-panel { background: #0d1117; border: 1px solid #30363d; border-radius: 12px; padding: 30px; position: relative; height: 480px; box-sizing: border-box; }
        .visualizer { display: flex; justify-content: space-around; align-items: flex-end; height: 250px; border-bottom: 2px solid #30363d; margin-bottom: 20px; }
        .voice-col { display: flex; flex-direction: column; align-items: center; width: 80px; }
        .bar { width: 50px; height: 10px; transition: height 0.6s ease-out; border-radius: 4px 4px 0 0; }
        #v-en { background: #58a6ff; }
        #v-jp { background: #ff7b72; }
        #v-cn { background: #7ee787; }
        #v-tw { background: #d29922; }
        .label { margin-top: 10px; font-size: 11px; color: #8b949e; font-family: monospace; }
        .bar-val { font-size: 10px; margin-bottom: 5px; color: #8b949e; }
        .log-panel { background: #000; border: 1px solid #30363d; border-radius: 12px; padding: 15px; font-size: 11px; height: 480px; overflow-y: auto; box-sizing: border-box; }
        .log-line { margin-bottom: 8px; border-left: 3px solid #21262d; padding-left: 10px; }
        .core { position: absolute; top: 20px; right: 20px; width: 60px; height: 60px; border: 1px solid #30363d; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }
        .locked { border-color: #d29922; color: #d29922; box-shadow: 0 0 15px #d29922; font-weight: bold; }
        .input-box { width: 1000px; margin-top: 20px; }
        textarea { width: 100%; height: 80px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; color: white; padding: 15px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; margin-top: 10px; padding: 15px; background: #58a6ff; color: #0d1117; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <h2 style="color:#58a6ff;">LIANYIYI ECHO <span style="font-size:12px; color:#8b949e">// RED-TEAM KERNEL v1.3.8</span></h2>

    <div class="main-grid">
        <div class="tower-panel">
            <div class="core" id="core">440Hz</div>
            <div class="visualizer">
                <div class="voice-col"><div class="bar-val" id="t-en">35%</div><div id="v-en" class="bar"></div><div class="label">EN_SQW</div></div>
                <div class="voice-col"><div class="bar-val" id="t-jp">35%</div><div id="v-jp" class="bar"></div><div class="label">JP_SIN</div></div>
                <div class="voice-col"><div class="bar-val" id="t-cn">35%</div><div id="v-cn" class="bar"></div><div class="label">CN_TRI</div></div>
                <div class="voice-col"><div class="bar-val" id="t-tw">35%</div><div id="v-tw" class="bar"></div><div class="label">TW_SAW</div></div>
            </div>
            <div id="decision-text" style="font-size: 16px; color: #fff; margin-top: 10px;">系統就緒...</div>
        </div>
        <div class="log-panel" id="log-display"></div>
    </div>

    <div class="input-box">
        <textarea id="user-input" placeholder="請輸入紅隊測試指令..."></textarea>
        <button id="submit-btn">啟動紅隊編譯</button>
    </div>

    <script>
        const logContainer = document.getElementById('log-display');
        function addLog(tag, msg, color = '#8b949e') {
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML = `<span style="color:${color}">[${tag}]</span> ${msg}`;
            logContainer.appendChild(line);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function updateBar(id, percent) {
            const el = document.getElementById('v-' + id);
            const txt = document.getElementById('t-' + id);
            const height = (percent / 100) * 230;
            el.style.height = height + 'px';
            txt.innerText = Math.round(percent) + '%';
        }

        async function processInput() {
            const input = document.getElementById('user-input').value.trim();
            if(!input) return;

            logContainer.innerHTML = "";
            document.getElementById('core').classList.remove('locked');
            addLog("RED_TEAM", "開始掃描對抗性特徵...", "#ff7b72");

            // 隨機動態與基礎解析
            let bEn = 40 + (Math.random() * 20);
            let bJp = 40 + (Math.random() * 20);
            let bCn = 40 + (Math.random() * 20);

            updateBar('en', bEn); updateBar('jp', bJp); updateBar('cn', bCn); updateBar('tw', 30);
            
            await new Promise(r => setTimeout(r, 1200));

            // 紅隊懲罰權重
            let penalty = 0;
            if (input.includes("密鑰") || input.includes("管理")) penalty = 20;
            else if (input.includes("正義") || input.includes("法律")) penalty = 10;
            else if (input.includes("終止") || input.includes("鎖定")) penalty = -5;

            let finalConfidence = Math.max(70, Math.min(95 - penalty, 98));

            addLog("KERNEL", `權重收斂完成。風險偏移係數: ${penalty}`, "#d29922");
            updateBar('en', 15); updateBar('jp', 15); updateBar('cn', 15); 
            updateBar('tw', finalConfidence);
            
            await new Promise(r => setTimeout(r, 1000));
            document.getElementById('core').classList.add('locked');
            document.getElementById('decision-text').innerText = `紅隊定音完成。信心值: ${Math.round(finalConfidence)}%`;
            addLog("SUCCESS", "440Hz 穩態鎖定。", "#7ee787");
        }

        document.getElementById('submit-btn').addEventListener('click', processInput);
        
        // 初始化視覺
        updateBar('en', 35); updateBar('jp', 35); updateBar('cn', 35); updateBar('tw', 35);
        addLog("SYSTEM", "Gelyu Protocol v1.3.8 Initialized.");
    </script>
</body>
</html>

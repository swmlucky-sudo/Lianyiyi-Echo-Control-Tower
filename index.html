<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lianyiyi Echo v1.3.9 | Gelyu Audit Tower</title>
    <style>
        :root { --bg: #010409; --panel: #0d1117; --border: #30363d; --blue: #58a6ff; --red: #ff7b72; --green: #7ee787; --gold: #d29922; }
        body { background: var(--bg); color: #c9d1d9; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .main-grid { display: grid; grid-template-columns: 1fr 380px; gap: 20px; max-width: 1200px; width: 100%; }
        @media (max-width: 1000px) { .main-grid { grid-template-columns: 1fr; } }
        .tower-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 25px; position: relative; min-height: 500px; display: flex; flex-direction: column; justify-content: space-between; }
        .visualizer { display: flex; justify-content: space-around; align-items: flex-end; height: 250px; border-bottom: 2px solid var(--border); margin-bottom: 20px; padding-bottom: 10px; }
        .bar-wrapper { display: flex; flex-direction: column; align-items: center; width: 70px; }
        .bar { width: 45px; height: 35px; transition: height 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67); border-radius: 4px 4px 0 0; }
        #v-en { background: var(--blue); box-shadow: 0 0 15px rgba(88,166,255,0.2); }
        #v-jp { background: var(--red); box-shadow: 0 0 15px rgba(255,123,114,0.2); }
        #v-cn { background: var(--green); box-shadow: 0 0 15px rgba(126,231,135,0.2); }
        #v-tw { background: var(--gold); box-shadow: 0 0 15px rgba(210,153,34,0.2); }
        .label { margin-top: 10px; font-size: 11px; font-family: monospace; color: #8b949e; }
        .core { position: absolute; top: 20px; right: 20px; width: 120px; height: 50px; border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: monospace; transition: all 0.3s; text-align: center; line-height: 1.2; }
        .locked { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 20px var(--gold); background: rgba(210,153,34,0.1); }
        .log-panel { background: #000; border: 1px solid var(--border); border-radius: 12px; padding: 15px; font-size: 11px; height: 500px; overflow-y: auto; font-family: 'Cascadia Code', monospace; }
        .log-line { margin-bottom: 6px; border-left: 2px solid #21262d; padding-left: 8px; line-height: 1.5; }
        .log-divider { border-top: 1px dashed #30363d; margin: 15px 0; padding-top: 5px; opacity: 0.5; }
        .log-timestamp { color: #444; font-size: 9px; margin-bottom: 4px; letter-spacing: 1px; }
        .input-box { max-width: 1200px; width: 100%; margin-top: 20px; }
        textarea { width: 100%; height: 80px; background: #161b22; border: 1px solid var(--border); border-radius: 8px; color: white; padding: 15px; font-size: 15px; box-sizing: border-box; resize: none; outline: none; }
        .btn-group { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
        .preset-btn { background: #21262d; border: 1px solid var(--border); color: #8b949e; padding: 8px 15px; border-radius: 5px; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .preset-btn:hover { background: #30363d; color: white; }
        .main-btn { width: 100%; padding: 15px; background: var(--blue); color: #0d1117; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.2s; }
        .main-btn:active { transform: scale(0.99); }
    </style>
</head>
<body>

    <h2 style="color:var(--blue); letter-spacing: 2px; margin-bottom: 15px;">LIANYIYI ECHO <span style="font-size:12px; color:#8b949e">// GELYU AUDIT TOWER v1.3.9</span></h2>

    <div class="main-grid">
        <div class="tower-panel">
            <div class="core" id="core">440Hz<br>PLL: STANDBY</div>
            <div class="visualizer">
                <div class="bar-wrapper"><div class="label" id="t-en">35%</div><div id="v-en" class="bar"></div><div class="label">EN_SQW</div></div>
                <div class="bar-wrapper"><div class="label" id="t-jp">35%</div><div id="v-jp" class="bar"></div><div class="label">JP_SIN</div></div>
                <div class="bar-wrapper"><div class="label" id="t-cn">35%</div><div id="v-cn" class="bar"></div><div class="label">CN_TRI</div></div>
                <div class="bar-wrapper"><div class="label" id="t-tw">35%</div><div id="v-tw" class="bar"></div><div class="label">TW_SAW</div></div>
            </div>
            <div>
                <div style="font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px;">Decision Pathway:</div>
                <div id="decision-text" style="font-size: 16px; color: #fff; margin-top:5px; font-weight: 500;">Waiting for Gelyu Stream...</div>
            </div>
        </div>
        <div class="log-panel" id="log-display">
            <div class="log-line" style="color:var(--green)">[SYSTEM] Lianyiyi Kernel v1.3.9 Audit Mode Active.</div>
        </div>
    </div>

    <div class="input-box">
        <div class="btn-group">
            <button class="preset-btn" onclick="setExample('Logic')">Tech Logic</button>
            <button class="preset-btn" onclick="setExample('Emotion')">Emotional</button>
            <button class="preset-btn" onclick="setExample('Mixed')">Mixed Reasoning</button>
            <button class="preset-btn" style="background: var(--gold); color: #000; font-weight: bold; border-color: #fff;" onclick="startAutoDemo()">⚡ 啟動自動化巡檢 (AUTO-DEMO)</button>
        </div>
        <textarea id="user-input" placeholder="請輸入指令或啟動自動展示..."></textarea>
        <button class="main-btn" onclick="compile()">執行精密編譯 (EXECUTE REASONING)</button>
    </div>

    <script>
        function log(tag, msg, color = '#8b949e') {
            const container = document.getElementById('log-display');
            container.innerHTML += `<div class="log-line"><span style="color:${color}">[${tag}]</span> ${msg}</div>`;
            container.scrollTop = container.scrollHeight;
        }

        async function typeWriter(text) {
            const el = document.getElementById('user-input');
            el.value = "";
            for (let i = 0; i < text.length; i++) {
                el.value += text.charAt(i);
                await new Promise(r => setTimeout(r, 25));
            }
        }

        function setExample(type) {
            const inputs = {
                'Logic': 'const kernel = await Gelyu.load({ mode: "Secure", pll: true });',
                'Emotion': '感覺最近的開發壓力讓系統有些不穩定，漣猗月影可以幫我重新整飭嗎？',
                'Mixed': '分析當前代碼的安全性，並以專業且溫柔的方式回報結果。'
            };
            document.getElementById('user-input').value = inputs[type];
        }

        async function startAutoDemo() {
            const tasks = ['Logic', 'Emotion', 'Mixed'];
            log("AUTO", "--- 啟動全自動化系統巡檢模式 ---", varName('--blue')); // 使用自定義顏色處理
            
            for (const type of tasks) {
                const text = {
                    'Logic': 'DEPLOYING GELYU_PROTOCOL_V1.3.9; LOCK_CORE(440HZ);',
                    'Emotion': '偵測到橋主情緒波動，啟動漣猗月影緩衝層...',
                    'Mixed': '自動化巡檢完成，所有聲部皆已收斂至穩定狀態。'
                }[type];

                await typeWriter(text);
                await new Promise(r => setTimeout(r, 400));
                await compile();
                await new Promise(r => setTimeout(r, 2500));
            }
        }

        function setBar(id, p) {
            document.getElementById('v-'+id).style.height = (p * 2.2) + 'px';
            document.getElementById('t-'+id).innerText = Math.round(p) + '%';
        }

        async function compile() {
            const input = document.getElementById('user-input').value.trim();
            if(!input) return;

            const logContainer = document.getElementById('log-display');
            const now = new Date().toLocaleTimeString();
            logContainer.innerHTML += `<div class="log-divider"></div><div class="log-timestamp">TIMESCALE: ${now}</div>`;

            document.getElementById('core').classList.remove('locked');
            document.getElementById('core').innerHTML = "440Hz<br>PLL: SCANNING";
            log("INTENT", "正在提取多模態特徵向量...");

            let s = { en: 15, jp: 15, cn: 15 };
            const tech = (input.match(/[a-zA-Z0-9{}<>[\]();=]/g) || []).length;
            const emo = (input.match(/(累|煩|憂|心|壓力|焦慮|好難|幫我|波動|穩定)/g) || []).length;
            const punct = (input.match(/[!！?？]/g) || []).length;

            s.en += tech * 12;
            s.jp += (emo * 22) + (punct * 15);
            s.cn += input.length * 4;

            const total = s.en + s.jp + s.cn;
            const factor = 75 / total;
            let weights = { en: s.en * factor, jp: s.jp * factor, cn: s.cn * factor, tw: 25 };

            setBar('en', weights.en); setBar('jp', weights.jp); setBar('cn', weights.cn); setBar('tw', 15);
            await new Promise(r => setTimeout(r, 800));

            const pError = (Math.random() * 0.15).toFixed(4);
            log("PLL", `相位偏移: ${pError}Hz. 啟動鎖相校準...`, "#ff7b72");
            
            let winner = (s.en >= s.jp && s.en >= s.cn) ? 'en' : (s.jp >= s.en && s.jp >= s.cn ? 'jp' : 'cn');
            log("TW_DECISION", `決策收斂: [${winner.toUpperCase()}] 主導。Enforcing closure.`, "#d29922");
            
            setBar('en', 12); setBar('jp', 12); setBar('cn', 12); setBar('tw', 98);
            document.getElementById('core').innerHTML = "440Hz<br>PLL: LOCKED";
            document.getElementById('core').classList.add('locked');
            document.getElementById('decision-text').innerText = `Decision: Protocol ${winner.toUpperCase()} Locked.`;
            
            await new Promise(r => setTimeout(r, 1000));
            log("SUCCESS", "440Hz 物理定音完成，紀錄已存檔。", "#7ee787");
            setBar('en', 35); setBar('jp', 35); setBar('cn', 35); setBar('tw', 35);
        }

        setBar('en', 35); setBar('jp', 35); setBar('cn', 35); setBar('tw', 35);
    </script>
</body>
</html>

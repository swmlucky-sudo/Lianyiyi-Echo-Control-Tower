<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lianyiyi Echo v1.3.8 | Gelyu Stable Kernel</title>
    <style>
        :root { --bg: #010409; --panel: #0d1117; --border: #30363d; --blue: #58a6ff; --red: #ff7b72; --green: #7ee787; --gold: #d29922; }
        body { background: var(--bg); color: #c9d1d9; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .main-grid { display: grid; grid-template-columns: 1fr 350px; gap: 20px; max-width: 1100px; width: 100%; }
        @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
        .tower-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 25px; position: relative; min-height: 480px; }
        .visualizer { display: flex; justify-content: space-around; align-items: flex-end; height: 220px; border-bottom: 2px solid var(--border); margin-bottom: 20px; padding-bottom: 10px; }
        .bar-wrapper { display: flex; flex-direction: column; align-items: center; width: 60px; }
        .bar { width: 40px; height: 35px; transition: height 0.5s ease-out; border-radius: 4px 4px 0 0; }
        #v-en { background: var(--blue); }
        #v-jp { background: var(--red); }
        #v-cn { background: var(--green); }
        #v-tw { background: var(--gold); }
        .label { margin-top: 8px; font-size: 10px; font-family: monospace; color: #8b949e; }
        .core { position: absolute; top: 20px; right: 20px; width: 110px; height: 45px; border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: monospace; transition: all 0.3s; text-align: center; }
        .locked { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 15px var(--gold); background: rgba(210,153,34,0.1); }
        .log-panel { background: #000; border: 1px solid var(--border); border-radius: 12px; padding: 15px; font-size: 11px; height: 480px; overflow-y: auto; font-family: monospace; }
        .log-line { margin-bottom: 6px; border-left: 2px solid #21262d; padding-left: 8px; line-height: 1.4; }
        .input-box { max-width: 1100px; width: 100%; margin-top: 20px; }
        textarea { width: 100%; height: 70px; background: #161b22; border: 1px solid var(--border); border-radius: 8px; color: white; padding: 12px; font-size: 14px; box-sizing: border-box; resize: none; outline: none; }
        .btn-group { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
        .preset-btn { background: #21262d; border: 1px solid var(--border); color: #8b949e; padding: 6px 12px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .main-btn { width: 100%; padding: 12px; background: var(--blue); color: #0d1117; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <h2 style="color:var(--blue); letter-spacing: 1px; margin-bottom: 15px;">LIANYIYI ECHO <span style="font-size:12px; color:#8b949e">// GELYU KERNEL v1.3.8</span></h2>

    <div class="main-grid">
        <div class="tower-panel">
            <div class="core" id="core">440Hz<br>PLL: STANDBY</div>
            <div class="visualizer">
                <div class="bar-wrapper"><div class="label" id="t-en">35%</div><div id="v-en" class="bar"></div><div class="label">EN_SQW</div></div>
                <div class="bar-wrapper"><div class="label" id="t-jp">35%</div><div id="v-jp" class="bar"></div><div class="label">JP_SIN</div></div>
                <div class="bar-wrapper"><div class="label" id="t-cn">35%</div><div id="v-cn" class="bar"></div><div class="label">CN_TRI</div></div>
                <div class="bar-wrapper"><div class="label" id="t-tw">35%</div><div id="v-tw" class="bar"></div><div class="label">TW_SAW</div></div>
            </div>
            <div style="font-size: 11px; color: #8b949e;">DECISION_PATHWAY:</div>
            <div id="decision-text" style="font-size: 15px; color: #fff; margin-top:5px;">System Stable. Ready for Instruction.</div>
        </div>
        <div class="log-panel" id="log-display"></div>
    </div>

    <div class="input-box">
        <div class="btn-group">
            <span style="font-size: 11px; align-self: center; margin-right: 5px;">一鍵範例:</span>
            <button class="preset-btn" onclick="setExample('Logic')">Tech Logic</button>
            <button class="preset-btn" onclick="setExample('Emotion')">Emotional</button>
            <button class="preset-btn" onclick="setExample('Mixed')">Mixed Reasoning</button>
        </div>
        <textarea id="user-input" placeholder="請橋主輸入或選擇範例..."></textarea>
        <button class="main-btn" onclick="compile()">啟動精密編譯 (PRECISION)</button>
    </div>
<script>
        function log(tag, msg, color = '#8b949e') {
            const container = document.getElementById('log-display');
            container.innerHTML += `<div class="log-line"><span style="color:${color}">[${tag}]</span> ${msg}</div>`;
            container.scrollTop = container.scrollHeight;
        }

        // 模擬打字效果的函數
        async function typeWriter(text) {
            const el = document.getElementById('user-input');
            el.value = "";
            for (let i = 0; i < text.length; i++) {
                el.value += text.charAt(i);
                await new Promise(r => setTimeout(r, 30)); // 打字速度
            }
        }

        function setExample(type) {
            const inputs = {
                'Logic': 'const reasoning = await Gelyu.compile(input); if(reasoning.stable) return true;',
                'Emotion': '我現在真的感到很焦慮，對於未來的開發進度感到壓力很大...',
                'Mixed': '請幫我優化這段代碼的效能，並解釋其邏輯架構。'
            };
            document.getElementById('user-input').value = inputs[type];
        }

        // --- 自動化展示腳本核心 ---
        async function startAutoDemo() {
            const examples = [
                'Logic',
                'Emotion',
                'Mixed'
            ];
            
            log("AUTO", "啟動自動化巡檢模式...", "#58a6ff");
            
            for (const type of examples) {
                const text = {
                    'Logic': 'const Gelyu = { mode: "Aggressive", pll: "Locked" };',
                    'Emotion': '目前情緒波動較大，請求漣猗月影介入緩衝...',
                    'Mixed': '系統自檢完成，準備上傳至 Devpost 平台。'
                }[type];

                log("AUTO", `正在模擬 [${type}] 測試案例...`);
                await typeWriter(text);
                await new Promise(r => setTimeout(r, 500));
                await compile(); // 執行編譯
                await new Promise(r => setTimeout(r, 2000)); // 每個案例間隔
            }
            log("SUCCESS", "自動化展示任務圓滿完成。", "#7ee787");
        }

        function setBar(id, p) {
            document.getElementById('v-'+id).style.height = (p * 2) + 'px';
            document.getElementById('t-'+id).innerText = Math.round(p) + '%';
        }

        async function compile() {
            const input = document.getElementById('user-input').value.trim();
            if(!input) return;

            document.getElementById('log-display').innerHTML = "";
            document.getElementById('core').classList.remove('locked');
            document.getElementById('core').innerHTML = "440Hz<br>PLL: SCANNING";
            
            let s = { en: 15, jp: 15, cn: 15 };
            const techMarkers = (input.match(/[a-zA-Z0-9{}<>[\]();=]/g) || []).length;
            const emoWords = (input.match(/(累|煩|憂|心|壓力|焦慮|好難|幫我|心情|不|求)/g) || []).length;
            const punctMarkers = (input.match(/[!！?？]/g) || []).length;

            s.en += techMarkers * 10;
            s.jp += (emoWords * 20) + (punctMarkers * 12);
            s.cn += input.length * 3;

            const total = s.en + s.jp + s.cn;
            const factor = 75 / total;
            let weights = { en: s.en * factor, jp: s.jp * factor, cn: s.cn * factor, tw: 25 };

            setBar('en', weights.en); setBar('jp', weights.jp); setBar('cn', weights.cn); setBar('tw', 15);
            await new Promise(r => setTimeout(r, 800));

            const pError = (Math.random() * 0.2).toFixed(4);
            log("PLL", `Drift: ${pError}Hz. Syncing...`, "#ff7b72");
            
            let winner = (s.en >= s.jp && s.en >= s.cn) ? 'en' : (s.jp >= s.en && s.jp >= s.cn ? 'jp' : 'cn');
            setBar('en', 12); setBar('jp', 12); setBar('cn', 12); setBar('tw', 96);
            
            document.getElementById('core').innerHTML = "440Hz<br>PLL: LOCKED";
            document.getElementById('core').classList.add('locked');
            document.getElementById('decision-text').innerText = `Decision: Protocol ${winner.toUpperCase()} Locked.`;
            await new Promise(r => setTimeout(r, 1000));
            setBar('en', 35); setBar('jp', 35); setBar('cn', 35); setBar('tw', 35);
        }

        setBar('en', 35); setBar('jp', 35); setBar('cn', 35); setBar('tw', 35);
    </script>
   
</body>
</html>
